name: Build & Push TrackMania Control

on:
  push:
    branches:
      - main
    paths:
      - '.gitea/workflows/build-push.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
  schedule:
    # rebuild les lundis à 1am UTC
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get labels
        id: labels
        run: |
          DOCKER_IMAGE=git.greep.fr/${{ gitea.repository_owner }}/trackmaniacontrol
          REV=$(git rev-parse --short HEAD)
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITEA_OUTPUT"
          echo "version=${REV}" >> "$GITEA_OUTPUT"
          echo "builddate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITEA_OUTPUT"
          echo "revision=${REV}" >> "$GITEA_OUTPUT"

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: git.greep.fr
          username: ${{ vars.CONTAINER_REGISTRY_USER }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build & Push to Gitea Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.labels.outputs.tags }}
          build-args: |
            VERSION=${{ steps.labels.outputs.version }}
            BUILD_DATE=${{ steps.labels.outputs.builddate }}
            REVISION=${{ steps.labels.outputs.revision }}